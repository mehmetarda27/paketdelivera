services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      TRUST_PROXY: "true"
      DATABASE_PATH: /data/delivera.sqlite
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgres://delivera:delivera_change_me@postgres:5432/delivera
    volumes:
      - delivera-data:/data
      - ./logs:/app/logs
    depends_on:
      - redis
      - postgres

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: delivera
      POSTGRES_USER: delivera
      POSTGRES_PASSWORD: delivera_change_me
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./deploy/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U delivera -d delivera"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  delivera-data:
  redis-data:
  postgres-data:
