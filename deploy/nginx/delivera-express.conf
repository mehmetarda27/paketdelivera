server {
    listen 80;
    listen [::]:80;
    server_name app.deliveraexpress.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.deliveraexpress.com;

    ssl_certificate /etc/letsencrypt/live/app.deliveraexpress.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.deliveraexpress.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:DeliveraSSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 10m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 60s;
    }
}
