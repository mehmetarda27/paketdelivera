<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Delivera Express</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <main class="popup-shell">
    <div class="popup-head">
      <p class="eyebrow">Delivera Express</p>
      <h1>Siparisi Delivera'ya Gonder</h1>
    </div>

    <label>
      Backend URL
      <input id="backendUrl" type="url" value="https://paketdelivera.onrender.com" placeholder="https://paketdelivera.onrender.com">
    </label>

    <label>
      Restaurant Token
      <textarea id="restaurantToken" rows="3" placeholder="Bearer token veya sadece token"></textarea>
    </label>

    <label>
      Platform
      <select id="platformSelect">
        <option value="Getir">Getir</option>
        <option value="Trendyol Yemek">Trendyol Yemek</option>
        <option value="Migros Yemek">Migros Yemek</option>
        <option value="Yemeksepeti">Yemeksepeti</option>
        <option value="Diger">Diger</option>
      </select>
    </label>

    <label class="toggle-card">
      <span>
        <strong>Otomatik Izleme</strong>
        <small>Sadece kabul edilmis veya hazirlanan siparisleri otomatik gonder.</small>
      </span>
      <input id="autoWatchToggle" type="checkbox">
    </label>

    <section class="status-card">
      <strong>Algilanan Platform</strong>
      <p id="detectedPlatformText">Henuz yok</p>
    </section>

    <div class="button-stack">
      <button id="sendButton" class="primary-btn" type="button">Siparisi Delivera'ya Gonder</button>
      <button id="copyButton" class="ghost-btn" type="button">Sadece Kopyala</button>
    </div>

    <section class="status-card">
      <strong>Durum</strong>
      <p id="statusText">Hazir</p>
    </section>

    <section class="status-card">
      <strong>Son Algilanan Siparis Ozeti</strong>
      <p id="lastCandidateText">Henuz yok</p>
    </section>

    <section class="stats-grid">
      <article class="status-card compact">
        <strong>Son Gonderim Durumu</strong>
        <p id="lastPostStatus">Henuz yok</p>
      </article>
      <article class="status-card compact">
        <strong>Son Hata</strong>
        <p id="lastErrorText">Yok</p>
      </article>
      <article class="status-card compact">
        <strong>Gonderilen Siparis Sayisi</strong>
        <p id="sentCountText">0</p>
      </article>
      <article class="status-card compact">
        <strong>Duplicate Engellenen Siparis Sayisi</strong>
        <p id="duplicateCountText">0</p>
      </article>
    </section>
  </main>
  <script src="./shared.js"></script>
  <script src="./popup.js"></script>
</body>
</html>
